spring.application.name=hotel-booking
server.port=8080

# booking
hotel.booking.hold-minutes=15
hotel.booking.max-nights=30
hotel.booking.expiry-sweep-ms=30000

# pricing strategy: base | weekend-surcharge
hotel.pricing.strategy=base
hotel.pricing.weekend-surcharge-percent=20

# load a few demo properties on startup
hotel.seed.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
